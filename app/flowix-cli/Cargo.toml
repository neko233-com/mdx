[package]
name = "flowix-cli"
version = "0.1.7"
description = "MDX local Markdown CLI and MCP server"
authors = ["Flowix Contributors"]
edition.workspace = true
default-run = "mdx-cli"

[[bin]]
name = "mdx-cli"
path = "src/main.rs"

[dependencies]
flowix-core = { workspace = true }
flowix-plugin-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
nanoid = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
shell-words = { workspace = true }

# Windows 专用: 启动时把 console codepage 切到 UTF-8, 非 Windows 不构建。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
