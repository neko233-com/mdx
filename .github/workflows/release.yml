name: Release MDX

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mdx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      max-parallel: 1 # each build merges its platform into latest.json
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            config: app/flowix-desktop/tauri.windows.conf.json
          - runner: macos-15
            target: aarch64-apple-darwin
            config: app/flowix-desktop/tauri.macos.conf.json
          - runner: macos-15
            target: x86_64-apple-darwin
            config: app/flowix-desktop/tauri.macos.conf.json
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
      - run: npm ci --no-audit --no-fund
      - name: Build MDX CLI sidecar
        run: npm run cli:build:prod -- --target=${{ matrix.target }}
      - name: Build desktop app and signed updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: v__VERSION__
          releaseName: MDX v__VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config app/flowix-desktop/tauri.conf.json --config ${{ matrix.config }} --target ${{ matrix.target }}

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub and mirror manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP"
          node scripts/create-mirror-manifest.mjs "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/latest-mirror.json"
          gh release upload "$tag" "$RUNNER_TEMP/latest-mirror.json" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
