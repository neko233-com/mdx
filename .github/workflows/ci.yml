name: CI

# 仅在显式手动触发时运行；日常提交和 tag 不占用 GitHub Actions 额度。
# 桌面安装包由 Windows/macOS 本机构建并手动上传 GitHub Releases。
#
# 设计原则：先保证"绿灯可跑"，再逐步收紧。
#   - clippy 暂不加 `-D warnings`（代码库历史较长，尚未确认是否 clippy-clean）；
#     待清理干净后可改为 `cargo clippy --workspace --all-targets -- -D warnings` 升级为阻断式。
#   - 可选后续：加 `cargo fmt --check`（需先统一格式）。

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · typecheck + unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@10.8.2 --no-audit --no-fund

      - name: Check package manager policy
        run: |
          test "$(npm --version)" = "10.8.2"
          npm run check:package-manager

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Desktop web production build
        run: npm run build

      - name: Desktop web bundle budgets
        run: npm run check:web-bundle

      - name: Layer boundaries
        run: npm run check:layers

      - name: Frontend debt ratchets
        run: npm run check:frontend-debt

      - name: Unit tests
        run: npm test

  rust:
    name: Rust · clippy + tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linux system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/target -> ci

      - name: Build CLI sidecar for Tauri checks
        run: npm run cli:build:dev

      - name: Clippy
        working-directory: app
        run: cargo clippy --workspace --all-targets

      - name: Tests
        working-directory: app
        # Keep environment-sensitive integration tests (notably DSH/Wry) out
        # of the baseline workspace gate. They have a dedicated manual job.
        run: cargo test --workspace --lib
